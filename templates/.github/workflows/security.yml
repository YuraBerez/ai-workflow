# Security checks for a project. Copy this file to .github/workflows/security.yml.
# The devops agent keeps it the same as the quality gate of the project.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the files and the git history
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 git --redact --no-banner /repo

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install actionlint and zizmor
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 "$HOME/.local/bin"
          python3 -m pip install --user --quiet 'zizmor==1.33.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint the workflows
        run: |
          actionlint
          zizmor --offline .github/workflows

  dependencies:
    name: Dependencies (dependency review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high

  # Add the dependency audit of the stack, for example:
  #   npm audit --audit-level=high
  #   pip-audit
  #   dotnet list package --vulnerable --include-transitive
  #   flutter pub outdated (no audit tool; use OSV-Scanner)
  # and a static analysis, for example github/codeql-action or semgrep.
